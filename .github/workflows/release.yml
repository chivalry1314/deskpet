name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__
          releaseName: 'DeskPet Engine __VERSION__'
          releaseBody: |
            根据你的系统下载对应安装包：
            - **Windows (x64)**：`DeskPet Engine___VERSION___x64-setup.exe` 或 `DeskPet Engine___VERSION___x64_zh-CN.msi`
            - **macOS (Apple Silicon M1+)**：`DeskPet Engine___VERSION___aarch64.dmg`
            - **macOS (Intel)**：`DeskPet Engine___VERSION___x64.dmg`
            - **Linux (x64)**：`deskpet-engine___VERSION___amd64.AppImage` 或 `deskpet-engine___VERSION___amd64.deb`
            
            下载后安装并运行即可。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
