name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: |
          export VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          node - <<'NODE_SCRIPT'
            const fs = require('fs');
            const version = process.env.VERSION;
            if (!version) throw new Error('VERSION not set');
            console.log('Syncing version:', version);

            // package.json
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            // Cargo.toml
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = ".*"/m, `version = "${version}"`);
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);

            // tauri.conf.json
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          NODE_SCRIPT

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Update Cargo.lock
        run: cargo update -w
        working-directory: ./src-tauri

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DeskPet Engine ${{ github.ref_name }}'
          releaseBody: |
            根据你的系统下载对应安装包：
            - **Windows (x64)**：`DeskPet Engine_${{ github.ref_name }}_x64-setup.exe` 或 `DeskPet Engine_${{ github.ref_name }}_x64_zh-CN.msi`
            - **macOS (Apple Silicon M1+)**：`DeskPet Engine_${{ github.ref_name }}_aarch64.dmg`
            - **macOS (Intel)**：`DeskPet Engine_${{ github.ref_name }}_x64.dmg`
            - **Linux (x64)**：`deskpet-engine_${{ github.ref_name }}_amd64.AppImage` 或 `deskpet-engine_${{ github.ref_name }}_amd64.deb`
            
            下载后安装并运行即可。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
