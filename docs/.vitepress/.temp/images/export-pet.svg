<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <rect x="0" y="0" width="900" height="520" fill="#e2e8f0"/>
  <!-- manager -->
  <rect x="10" y="10" width="880" height="500" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">DeskPet Engine</text>
  <rect x="30" y="90" width="840" height="390" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <rect x="48" y="120" width="56" height="56" rx="10" fill="#f1f5f9"/>
  <text x="76" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28">🐾</text>
  <text x="120" y="147" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">橘猫小咪</text>
  <text x="120" y="167" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">v1.0 · 匿名</text>
  <rect x="680" y="130" width="50" height="34" rx="8" fill="#10b981"/>
  <text x="705" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#fff">运行</text>
  <rect x="740" y="130" width="44" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="762" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">编辑</text>
  <rect x="794" y="130" width="44" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="816" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#334155">导出</text>
  <circle cx="816" cy="147" r="40" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- export result popup -->
  <rect x="280" y="200" width="340" height="120" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="drop-shadow(0 4px 6px rgb(0 0 0 / 0.1))"/>
  <text x="450" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">导出成功</text>
  <text x="450" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">已导出: C:\...\DeskPet\exports\橘猫小咪.pet</text>
  <rect x="380" y="285" width="60" height="28" rx="6" fill="#4f46e5"/>
  <text x="410" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">确定</text>
  <text x="450" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">导出后会自动打开 exports 文件夹，文件可直接分享</text>
</svg>
