<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)" rx="24"/>
  <!-- cat body -->
  <ellipse cx="100" cy="120" rx="45" ry="38" fill="#fb923c"/>
  <!-- head -->
  <circle cx="100" cy="85" r="35" fill="#fb923c"/>
  <!-- ears -->
  <polygon points="70,65 80,30 95,55" fill="#fb923c"/>
  <polygon points="130,65 120,30 105,55" fill="#fb923c"/>
  <polygon points="75,60 82,38 92,53" fill="#fff7ed"/>
  <polygon points="125,60 118,38 108,53" fill="#fff7ed"/>
  <!-- eyes -->
  <circle cx="88" cy="82" r="4" fill="#1e293b"/>
  <circle cx="112" cy="82" r="4" fill="#1e293b"/>
  <!-- nose/mouth -->
  <path d="M97 92 L100 95 L103 92" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="90" r="2" fill="#7c2d12"/>
  <!-- paws -->
  <ellipse cx="75" cy="148" rx="10" ry="8" fill="#fff7ed"/>
  <ellipse cx="125" cy="148" rx="10" ry="8" fill="#fff7ed"/>
  <!-- tail -->
  <path d="M140 120 Q170 100 165 130" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
  <!-- shadow base -->
  <ellipse cx="100" cy="165" rx="55" ry="8" fill="#cbd5e1" opacity="0.6"/>
  <text x="100" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">DeskPet Engine</text>
</svg>
