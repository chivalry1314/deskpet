<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <rect width="900" height="320" fill="#fff"/>
  <text x="30" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">往返循环消除首尾跳变</text>
  <text x="30" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">适用于 AI 生成的循环动画，首尾帧衔接不自然时使用。</text>
  <!-- frames -->
  <rect x="30" y="110" width="70" height="70" rx="8" fill="#fb923c" opacity="0.8"/>
  <text x="65" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">帧 1</text>
  <rect x="110" y="110" width="70" height="70" rx="8" fill="#fb923c" opacity="0.8"/>
  <text x="145" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">帧 2</text>
  <rect x="190" y="110" width="70" height="70" rx="8" fill="#fb923c" opacity="0.8"/>
  <text x="225" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">帧 3</text>
  <rect x="270" y="110" width="70" height="70" rx="8" fill="#fb923c" opacity="0.8"/>
  <text x="305" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">帧 4</text>
  <rect x="350" y="110" width="70" height="70" rx="8" fill="#fb923c" opacity="0.8"/>
  <text x="385" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">帧 5</text>
  <!-- arrows normal -->
  <path d="M100 145 L110 145" stroke="#64748b" stroke-width="2" marker-end="url(#pn)"/>
  <path d="M180 145 L190 145" stroke="#64748b" stroke-width="2" marker-end="url(#pn)"/>
  <path d="M260 145 L270 145" stroke="#64748b" stroke-width="2" marker-end="url(#pn)"/>
  <path d="M340 145 L350 145" stroke="#64748b" stroke-width="2" marker-end="url(#pn)"/>
  <defs><marker id="pn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <text x="210" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">直接循环：帧 5 → 帧 1 可能跳变</text>
  <!-- pingpong arrows -->
  <path d="M450 145 L520 145 L520 185 L450 185" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#pp)"/>
  <path d="M530 185 L600 185 L600 145 L530 145" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#pp)"/>
  <path d="M610 145 L680 145 L680 185 L610 185" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#pp)"/>
  <path d="M690 185 L760 185 L760 145 L690 145" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#pp)"/>
  <defs><marker id="pp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker></defs>
  <text x="600" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4f46e5">往返循环：播到末尾后倒放，消除跳变</text>
  <text x="450" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">示意图：在状态卡片中把「循环方式」设为「往返循环」</text>
</svg>
