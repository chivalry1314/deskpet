<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <rect x="0" y="0" width="900" height="520" fill="#000" opacity="0.25"/>
  <!-- manager background -->
  <rect x="10" y="10" width="880" height="500" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">DeskPet Engine</text>
  <rect x="780" y="35" width="80" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="820" y="57" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">设置</text>
  <!-- settings panel -->
  <rect x="150" y="100" width="600" height="340" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="drop-shadow(0 4px 6px rgb(0 0 0 / 0.1))"/>
  <text x="170" y="135" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">运行设置</text>
  <rect x="170" y="250" width="560" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="185" y="280" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">数据目录</text>
  <text x="185" y="310" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">C:\Users\...\AppData\Roaming\DeskPet</text>
  <rect x="185" y="330" width="80" height="28" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="225" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#334155">更改目录</text>
  <rect x="275" y="330" width="80" height="28" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="315" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#334155">恢复默认</text>
  <circle cx="225" cy="344" r="30" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- file dialog -->
  <rect x="400" y="200" width="300" height="140" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="drop-shadow(0 4px 6px rgb(0 0 0 / 0.1))"/>
  <text x="550" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">选择文件夹</text>
  <rect x="420" y="260" width="260" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="430" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#334155">D:\我的文档\DeskPetData</text>
  <rect x="420" y="300" width="60" height="28" rx="6" fill="#4f46e5"/>
  <text x="450" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">选择</text>
  <rect x="490" y="300" width="60" height="28" rx="6" fill="#e2e8f0"/>
  <text x="520" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">取消</text>
  <text x="550" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">选择新目录后可选择是否迁移宠物</text>
</svg>
