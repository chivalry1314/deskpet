<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <rect width="900" height="320" fill="#fff"/>
  <text x="30" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">GIF / 视频 自动拆帧</text>
  <!-- gif file -->
  <rect x="30" y="80" width="100" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">动画.gif</text>
  <text x="80" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">或 .mp4</text>
  <path d="M130 130 L180 130" stroke="#64748b" stroke-width="2" marker-end="url(#gs)"/>
  <defs><marker id="gs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <!-- split frames -->
  <rect x="200" y="100" width="70" height="70" rx="8" fill="#fb923c" opacity="0.8"/>
  <text x="235" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">帧 1</text>
  <rect x="280" y="100" width="70" height="70" rx="8" fill="#fb923c" opacity="0.8"/>
  <text x="315" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">帧 2</text>
  <rect x="360" y="100" width="70" height="70" rx="8" fill="#fb923c" opacity="0.8"/>
  <text x="395" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">帧 3</text>
  <rect x="440" y="100" width="70" height="70" rx="8" fill="#fb923c" opacity="0.8"/>
  <text x="475" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">帧 4</text>
  <text x="30" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">把 GIF 或 MP4 拖到编辑器上传区，会自动拆成逐帧 PNG。</text>
  <text x="30" y="250" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">系统会自动推断帧率（FPS），若不准确可手动修改。</text>
  <text x="450" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">示意图：GIF/视频 自动拆帧过程</text>
</svg>
